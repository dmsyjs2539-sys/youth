      <stop stop-color="#ffffff"/>
      <stop offset="1" stop-color="#b9dcff"/>
    </linearGradient>
    <linearGradient id="conf_shadow" x1="22" y1="22" x2="72" y2="64" gradientUnits="userSpaceOnUse">
      <stop stop-color="#d8ecff" stop-opacity="0.85"/>
