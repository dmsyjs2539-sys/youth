  <rect x="48" y="33" width="7" height="15" rx="3.5" fill="url(#conf_bar)" fill-opacity="0.85"/>
  <rect x="59" y="25" width="7" height="23" rx="3.5" fill="url(#conf_bar)" fill-opacity="0.65"/>

