    <linearGradient id="conf_stand" x1="48" y1="62" x2="48" y2="80" gradientUnits="userSpaceOnUse">
      <stop stop-color="#8fc9ff"/>
      <stop offset="1" stop-color="#2ba1ff" stop-opacity="0.5"/>
